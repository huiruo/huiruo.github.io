hildren\":\"Golang服务端开发工程师\\n任职资格\\n1、大专以上学历， 计算机或相关专业，5-10 年服务端开发经验，海外社交 / 直播项目经验优先；\\n2、精通 Go 语言开发，精通 TCP/IP 协议，HTTP 协议，socket 编程，多线程编程，熟悉 Linux 下常用架构设计方法；\\n3、精通 Mysql、Redis、MongoDB，熟悉数据库索引优化、Redis 缓存击穿 / 雪崩防护、MongoDB 分片与副本集部署；熟悉 kafka、NSQ 等消息队列中间件，理解 Etcd 分布式键值存储原理及服务注册发现、配置中心等场景应用；有高并发、大容量后台服务系统设计经验优先；\\n4、结果导向，逻辑思维强，能沉下心研究业务指标、产品逻辑，将业务需求转化为技术系统解决方案，具备优秀的问题分析和解决能力，能主动承担，乐于分享；\\n5、有大型分布式系统开发经验者优先，具备基于 Etcd+Redis+MongoDB 构建高可用分布式服务体系经验者优先。\"}],\"\\n\",[\"$\",\"h2\",null,{\"id\":\"岗位\",\"children\":\"岗位\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"像这些内容依然值得掌握：\"}],\"\\n\",[\"$\",\"ul\",null,{\"children\":[\"\\n\",[\"$\",\"li\",null,{\"children\":\"闭包、作用域、事件循环：直接影响 React stale closure、异步执行顺序和内存泄漏。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"原型链、this：有助于维护旧项目、理解 class、第三方库和运行时行为。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"Promise、任务调度：关系到请求竞态、并发控制、错误处理和页面响应。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"浏览器渲染、网络、缓存：关系到线上性能，而不只是面试。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"React/Vue 调度机制：关系到重复渲染、状态更新时机和复杂组件问题。\"}],\"\\n\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"但这些考法价值很低：\"}],\"\\n\",[\"$\",\"ul\",null,{\"children\":[\"\\n\",[\"$\",\"li\",null,{\"children\":\"背诵冷门规范名词。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"默写完整版 Promise。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"不结合场景地背宏任务、微任务列表。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"手写已经有成熟标准 API 的工具函数，却不讨论边界。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"用偏门输出题筛人。\"}],\"\\n\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"更合理的高级前端面试应该是：\"}],\"\\n\",[\"$\",\"ol\",null,{\"children\":[\"\\n\",[\"$\",\"li\",null,{\"children\":\"给一段 React 代码，解释为什么状态过期、为什么重复请求。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"给一次性能问题，让候选人用 Performance、Network、Heap Snapshot 定位。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"设计请求取消、缓存、重试、并发限制和错误隔离。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"让候选人审查 AI 生成的代码，找出竞态、泄漏、安全和维护性问题。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"讨论方案取舍，而不是只问“是什么”。\\n所以这份文档仍有价值，但不应该写成纯背诵手册。最好的结构是：\"}],\"\\n\"]}],\"\\n\",[\"$\",\"h2\",null,{\"id\":\"岗位1\",\"children\":\"岗位1\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"1、负责移动端活动H5和后台管理系统的设计、开发和维护；\\n2、负责H5页面的性能优化、架构优化、稳定性优化；\\n3、能够独立解决复杂的技术问题，提升产品质量和用户体验；\\n4、能够与产品、设计、后端等团队协作，保证项目的高效交付。\\n岗位要求：\\n1、2年及以上H5开发经验，熟悉网页程序设计，掌握浏览器基本原理和机制；\\n2、熟悉TypeScript语言、CSS和HTML5，有良好的编码风格和规范，能够编写高质量的代码；\\n3、熟悉React和Ant Design框架、掌握Webpack等前端打包工具；\\n4． 有讨移动端活动等相关项日经验者优先：\"}],\"\\n\",[\"$\",\"h2\",null,{\"id\":\"岗位2\",\"children\":\"岗位2\"}],\"\\n\",[\"$\",\"ol\",null,{\"children\":[\"\\n\",[\"$\",\"li\",null,{\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":\"熟悉Web/移动端，掌握浏览器基本原理和机制，具备独立开发能力\"}],\"\\n\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":\"熟悉H5、CSS、响应式布局，具备良好的页面还原能力和基础审美，关注交互细节和用户体验\"}],\"\\n\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":\"熟练掌握 JavaScript/TypeScript，理解浏览器运行机制、异步编程、模块化、网络请求和前端性能优化\"}],\"\\n\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":\"熟练使用Vue或React至少一种主流前端框架，能独立完成中大型业务模块开发\"}],\"\\n\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":\"理解常见前端架构问题，包括组件拆分、状态管理、接口封装、权限控制、错误处理、缓存策略等\"}],\"\\n\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":\"能与后端高效协作，理解RESTful API、WebSocket、SSE、鉴权、分页、异常码等常见接口设计\"}],\"\\n\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":\"掌握基本运维知识，能够独立完成前端项目\"}],\"\\n\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":\"Docker镜像构建、Nginx配置及静态资源部署上线。\"}],\"\\n\"]}],\"\\n\"]}],\"\\n\",[\"$\",\"h2\",null,{\"id\":\"移动端-h5-兼容性问题bfun-game-项目复盘\",\"children\":\"移动端 H5 兼容性问题（bfun-game 项目复盘）\"}],\"\\n\",[\"$\",\"h3\",null,{\"id\":\"2-ios-与-android-webview-桥接不统一\",\"children\":\"2. iOS 与 Android WebView 桥接不统一\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"Android WebView 常把桥接对象挂在 \",[\"$\",\"code\",null,{\"children\":\"window.jsBridge\"}],\"，iOS WKWebView 通常使用 \",[\"$\",\"code\",null,{\"children\":\"window.webkit.messageHandlers\"}],\"，而且不同 App 版本可能存在 \",[\"$\",\"code\",null,{\"children\":\"jsBridge\"}],\"、\",[\"$\",\"code\",null,{\"children\":\"nativeBridge\"}],\" 等不同命名。\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"项目采用多级探测和降级：\"}],\"\\n\",[\"$\",\"$L6\",null,{\"children\":[\"$\",\"code\",null,{\"className\":\"language-ts\",\"children\":\"if (window.jsBridge?.postMessage) {\\n  // Android\\n  window.jsBridge.postMessage(method, params)\\n} else if (window.webkit?.messageHandlers?.jsBridge) {\\n  // iOS 主桥接\\n  window.webkit.messageHandlers.jsBridge.postMessage({ method, params })\\n} else if (window.webkit?.messageHandlers?.nativeBridge) {\\n  // iOS 旧版本备用桥接\\n  window.webkit.messageHandlers.nativeBridge.postMessage({ method, params })\\n}\\n\"}]}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"同时给每次调用生成唯一回调名，并设置 5 秒超时；成功、失败或超时后清理全局回调，避免 Promise 永久 pending 和全局对象泄漏。桥接不存在时不继续假装处于 App 环境，而是清理错误的 App 状态并进入 Web 降级流程。\"}],\"\\n\",[\"$\",\"h3\",null,{\"id\":\"3-pwa-安装能力在不同浏览器中不一致\",\"children\":\"3. PWA 安装能力在不同浏览器中不一致\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"Chromium 浏览器可能触发 \",[\"$\",\"code\",null,{\"children\":\"beforeinstallprompt\"}],\"，iOS Safari 不支持同样的自动安装流程，Facebook 等内置浏览器也可能拦截安装。因此不能只用 UA 判断“支持 PWA”，也不能把“支持 Service Worker”等同于“当前可安装”。\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"项目将安装过程设计为状态机：初始化、可安装、安装中、已安装、不可安装，并组合判断：\"}],\"\\n\",[\"$\",\"ul\",null,{\"children\":[\"\\n\",[\"$\",\"li\",null,{\"children\":\"是否支持 Service Worker、Cache API、Fetch、Push Manager、Notification。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"是否处于 HTTPS 或 localhost 安全上下文。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"是否触发 \",[\"$\",\"code\",null,{\"children\":\"beforeinstallprompt\"}],\"、\",[\"$\",\"code\",null,{\"children\":\"appinstalled\"}],\"。\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"是否已运行在 \",[\"$\",\"code\",null,{\"children\":\"display-mode: standalone\"}],\"，以及 iOS 的 \",[\"$\",\"code\",null,{\"children\":\"navigator.standalone\"}],\"。\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"一定时间内未收到安装事件，则进入不可自动安装的降级分支。\"}],\"\\n\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"降级策略是：iOS 展示“添加到主屏幕”的手动指引；Android 尝试在默认浏览器重新打开；仍不支持时回到普通 Web 页面。用 URL 标记已经尝试过外部浏览器，避免反复跳转形成死循环。\"}],\"\\n\",[\"$\",\"h3\",null,{\"id\":\"4-app-内置浏览器和支付跳转\",\"children\":\"4. App 内置浏览器和支付跳转\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"Facebook IAB 等内置浏览器可通过 \",[\"$\",\"code\",null,{\"children\":\"FB_IAB\"}],\"、\",[\"$\",\"code\",null,{\"children\":\"FBAN\"}],\"、\",[\"$\",\"code\",null,{\"children\":\"FBAV\"}],\" 等 UA 特征辅助识别。Android 可尝试 \",[\"$\",\"code\",null,{\"children\":\"intent://\"}],\" 调起 Chrome；iOS 通常不能由网页强制拉起 Safari，只能普通跳转或引导用户手动操作。\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"支付跳转需要额外处理弹窗拦截：\",[\"$\",\"code\",null,{\"children\":\"window.open()\"}],\" 是否成功不只取决于 iOS，任何浏览器或内置 WebView 都可能在\",[\"$\",\"strong\",null,{\"children\":\"异步接口返回后\"}],\"拦截新窗口。项目中“创建支付订单前先打开 \",[\"$\",\"code\",null,{\"children\":\"about:blank\"}],\"，接口成功后再把支付地址写入该窗口”的思路，目的是让开窗发生在用户点击事件的同步调用栈内；它应按支付渠道和运行环境使用，不能简单写成“仅 iOS 需要新开窗口”。\"]}],\"\\n\",[\"$\",\"$L6\",null,{\"children\":[\"$\",\"code\",null,{\"className\":\"language-ts\",\"children\":\"// 必须在用户点击处理函数中同步执行，避免被弹窗拦截\\nconst payWindow = window.open(\\\"about:blank\\\", \\\"_blank\\\")\\n\\ntry {\\n  const order = await createPayOrder()\\n  if (!order.payUrl) throw new Error(\\\"missing pay url\\\")\\n\\n  if (payWindow) {\\n    payWindow.location.replace(order.payUrl)\\n  } else {\\n    // 降级：应明确告知用户将离开当前页\\n    window.location.assign(order.payUrl)\\n  }\\n} catch (error) {\\n  payWindow?.close()\\n  // 展示创建订单失败状态\\n}\\n\"}]}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"支付方案的优先级应是：\"}],\"\\n\",[\"$\",\"ol\",null,{\"children\":[\"\\n\",[\"$\",\"li\",null,{\"children\":\"App 容器已提供支付或外链 Bridge 时，优先调用 Bridge，由原生决定外部浏览器、支付 App 或内嵌页的打开方式。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"Web 端在用户点击时同步预开窗口；订单接口返回后跳转到受信任的支付地址。若预开窗口被拦截，再经用户确认在当前页跳转，或展示“点击继续支付”按钮，而不是静默重试开窗
