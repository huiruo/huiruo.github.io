hildren\":\"12. 常见追问\"}],\"\\n\",[\"$\",\"h3\",null,{\"id\":\"source-map-如何选择\",\"children\":\"source map 如何选择？\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"开发环境优先调试速度和定位体验，可使用较快的 eval 类 source map；生产环境在错误监控与源码泄露风险之间取舍，常上传隐藏 source map 到监控平台而不公开给浏览器。具体值应按项目调试与安全要求选择，不能照搬一种配置。\"}],\"\\n\",[\"$\",\"h3\",null,{\"id\":\"如何分析包体积\",\"children\":\"如何分析包体积？\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"先生成 \",[\"$\",\"code\",null,{\"children\":\"stats.json\"}],\" 或使用 \",[\"$\",\"code\",null,{\"children\":\"webpack-bundle-analyzer\"}],\" 看体积最大的 module、重复依赖和入口归属；再结合 Network 判断它是否处于首屏关键链路。优化后比较 gzip/brotli 大小、请求瀑布和 Web Vitals，避免只看未压缩的 bundle 数字。\"]}],\"\\n\",[\"$\",\"h3\",null,{\"id\":\"为什么开发环境不用生产配置\",\"children\":\"为什么开发环境不用生产配置？\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"开发优先增量构建与调试体验，通常需要 HMR、较快 source map，避免完整压缩；生产优先产物体积、缓存和稳定性，会启用压缩、内容 hash、抽离 CSS 等。使用 \",[\"$\",\"code\",null,{\"children\":\"webpack-merge\"}],\" 维护 common、dev、prod 配置，减少重复但不要混淆目标。\"]}],\"\\n\",[\"$\",\"h2\",null,{\"id\":\"13-面试收尾表达\",\"children\":\"13. 面试收尾表达\"}],\"\\n\",[\"$\",\"blockquote\",null,{\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":\"我不会只把 Webpack 当成“把文件合并起来”的工具。实际优化时，我先通过 stats 和 Bundle Analyzer 找到首屏大依赖与重复依赖，再用动态 import、splitChunks、contenthash 和 CDN 缓存缩短关键路径；构建慢则优先启用 filesystem cache、缩小 loader 处理范围。每次改动都会同时看构建时间、压缩后产物、Network 瀑布和 LCP，避免为了拆包而制造更多请求与解析开销。\"}],\"\\n\"]}],\"\\n\",[\"$\",\"h2\",null,{\"id\":\"14-webpack-与-vite区别与-vite-原理放在最后的追问\",\"children\":\"14. Webpack 与 Vite：区别与 Vite 原理（放在最后的追问）\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"Vite 是一套开发服务器与构建工具，不是“完全不打包的 Webpack 替代品”。它把开发和生产拆成两套更适合各自目标的流程：开发阶段优先让页面尽快启动和按需加载；生产阶段仍需要把代码处理成可高效缓存、可部署的静态产物。\"}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"mdx-table-scroll\",\"role\":\"region\",\"aria-label\":\"数据表格\",\"tabIndex\":0,\"children\":[\"$\",\"table\",null,{\"children\":[[\"$\",\"thead\",null,{\"children\":[\"$\",\"tr\",null,{\"children\":[[\"$\",\"th\",null,{\"children\":\"对比项\"}],[\"$\",\"th\",null,{\"children\":\"Webpack\"}],[\"$\",\"th\",null,{\"children\":\"Vite\"}]]}]}],[\"$\",\"tbody\",null,{\"children\":[[\"$\",\"tr\",null,{\"children\":[[\"$\",\"td\",null,{\"children\":\"开发时的源码服务方式\"}],[\"$\",\"td\",null,{\"children\":\"通常先由 Webpack 构建并维护模块依赖图，再提供模块/chunk\"}],[\"$\",\"td\",null,{\"children\":\"主要利用浏览器原生 ESM；浏览器请求哪个源码模块，服务端就转换并返回哪个模块\"}]]}],[\"$\",\"tr\",null,{\"children\":[[\"$\",\"td\",null,{\"children\":\"冷启动体验\"}],[\"$\",\"td\",null,{\"children\":\"项目很大时，首次编译的依赖图处理成本更明显\"}],[\"$\",\"td\",null,{\"children\":\"不必先打完整业务包，通常能更快启动服务\"}]]}],[\"$\",\"tr\",null,{\"children\":[[\"$\",\"td\",null,{\"children\":\"第三方依赖处理\"}],[\"$\",\"td\",null,{\"children\":\"由打包流程统一处理\"}],[\"$\",\"td\",null,{\"children\":\"首次启动时预构建依赖，减少浏览器对大量依赖文件的请求与 CommonJS 兼容问题\"}]]}],[\"$\",\"tr\",null,{\"children\":[[\"$\",\"td\",null,{\"children\":\"文件更新\"}],[\"$\",\"td\",null,{\"children\":\"重新构建受影响模块，并通过 HMR 推送更新\"}],[\"$\",\"td\",null,{\"children\":\"基于模块依赖边界精确失效并推送更新；修改范围小的时候反馈通常更快\"}]]}],[\"$\",\"tr\",null,{\"children\":[[\"$\",\"td\",null,{\"children\":\"生产构建\"}],[\"$\",\"td\",null,{\"children\":\"Webpack 负责模块打包、压缩、拆包与产物优化\"}],[\"$\",\"td\",null,{\"children\":\"默认使用 Rollup 进行打包和产物优化，也可按需要接入其他构建器\"}]]}],[\"$\",\"tr\",null,{\"children\":[[\"$\",\"td\",null,{\"children\":\"适配与生态\"}],[\"$\",\"td\",null,{\"children\":\"配置能力和历史生态非常成熟，适合复杂遗留链路\"}],[\"$\",\"td\",null,{\"children\":\"开发体验更轻量，插件需遵循 Vite/Rollup 的转换与打包模型\"}]]}]]}]]}]}],\"\\n\",[\"$\",\"h3\",null,{\"id\":\"vite-开发阶段的原理\",\"children\":\"Vite 开发阶段的原理\"}],\"\\n\",[\"$\",\"ol\",null,{\"children\":[\"\\n\",[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"浏览器请求 HTML\"}],\"：开发服务器返回 HTML，并注入 Vite 客户端脚本；源码中的模块引用保留为 ESM \",[\"$\",\"code\",null,{\"children\":\"import\"}],\"。\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"浏览器按需请求模块\"}],\"：页面执行到 \",[\"$\",\"code\",null,{\"children\":\"import '/src/main.tsx'\"}],\" 时，浏览器再请求该模块。Vite 按请求对 TypeScript、JSX、CSS 等源码做即时转换后返回，不需要为了展示首页先构建所有业务页面。\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"依赖预构建\"}],\"：\",[\"$\",\"code\",null,{\"children\":\"react\"}],\"、\",[\"$\",\"code\",null,{\"children\":\"lodash\"}],\" 等第三方依赖往往包含大量内部模块或 CommonJS 格式。Vite 会用 esbuild 将依赖预构建为浏览器更容易加载的 ESM 依赖，并缓存结果；这样既减少请求数量，也解决部分 CJS/UMD 兼容问题。依赖或锁文件变化时，预构建缓存会失效并重建。\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"HMR 精确更新\"}],\"：文件变化后，Vite 根据模块图找出受影响的模块与可接受更新的边界，经 WebSocket 通知浏览器。CSS 通常可直接替换；框架插件（例如 React Fast Refresh）负责判断组件状态能否保留。找不到接受边界时，才回退为页面刷新。\"]}],\"\\n\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"可以把两者在开发阶段的关键差异记成：\",[\"$\",\"strong\",null,{\"children\":\"Webpack 倾向于先组织构建图再服务；Vite 倾向于让浏览器按 ESM 依赖图按需取源码模块。\"}],\" 两者都会维护依赖关系、处理转换和支持 HMR，只是工作发生的时机与粒度不同。\"]}],\"\\n\",[\"$\",\"h3\",null,{\"id\":\"vite-生产阶段为什么仍要打包\",\"children\":\"Vite 生产阶段为什么仍要打包？\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"线上不能只把开发时的源码 ESM 原样交给用户。生产构建仍要做 Tree Shaking、压缩、CSS 提取、资源指纹、代码分割、预加载提示和兼容性处理，并把大量细碎模块合并为适合网络传输与长期缓存的 chunk。Vite 默认在这一步用 Rollup 分析静态 ESM 依赖图并生成产物；\",[\"$\",\"code\",null,{\"children\":\"import()\"}],\" 仍会形成异步 chunk。\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"因此，“Vite 开发不需要先打完整业务包”与“Vite 生产完全不打包”是两件事。面试中也不要把 esbuild、Rollup 和 Vite 混为一谈：Vite 主要使用 esbuild 完成开发期的依赖预构建与高性能转换，使用 Rollup 完成默认生产打包；具体插件和配置会影响实际链路。\"}],\"\\n\",[\"$\",\"h3\",null,{\"id\":\"如何选择\",\"children\":\"如何选择\"}],\"\\n\",[\"$\",\"ul\",null,{\"children\":[\"\\n\",[\"$\",\"li\",null,{\"children\":\"新项目、以现代浏览器为目标、希望获得快速启动和反馈时，Vite 往往是更省心的默认选择。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"已有大量 Webpack loader/plugin、Module Federation 或高度定制构建流程时，继续使用 Webpack 的迁移成本可能更低。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"最终不要以工具名称下结论：仍应比较真实的冷启动、HMR、生产包体、缓存命中、兼容性和团队维护成本。\"}],\"\\n\"]}],\"\\n\",[\"$\",\"h3\",null,{\"id\":\"60-秒面试回答\",\"children\":\"60 秒面试回答\"}],\"\\n\",[\"$\",\"blockquote\",null,{\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":\"Webpack 和 Vite 最大的区别在开发阶段。Webpack 通常需要先处理较多模块依赖再提供服务；Vite 利用浏览器原生 ESM，浏览器请求到哪个源码模块，开发服务器就即时转换并返回哪个模块，所以大项目冷启动和局部更新通常更快。Vite 会先用 esbuild 预构建第三方依赖，解决 CommonJS 兼容和依赖请求过碎的问题；文件变更后根据模块图经 WebSocket 推送 HMR。到了生产环境，Vite 仍需要打包，默认通过 Rollup 做 Tree Shaking、压缩、代码分割和带 hash 的静态产物。选型要看现有构建生态、兼容性和实际指标，而不是认为 Vite 天然在所有场景都更快。\"}],\"\\n\"]}]]],null],null]},[\"$\",\"$L7\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"interview\",\"children\",\"webpack\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L8\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\",\"styles\":[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/c31ee2375b90c4cc.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]]}],null]},[[\"$\",\"$L9\",null,{\"children\":[\"$\",\"$L7\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"interview\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L8\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\",\"styles\":null}],\"params\":{}}],null],null]},[[\"$\",\"html\",null,{\"lang\":\"zh-CN\",\"children\":[[\"$\",\"head\",null,{\"children\":[[\"$\",\"meta\",null,{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",null,{\"name\":\"application-name\",\"content\":\"Programming Tech\"}],[\"$\",\"meta\",null,{\"name\":\"apple-mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",null,{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"meta\",null,{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Programming Tech\"}]]}],[\"$\",\"body\",null,{\"children\":[[\"$\",\"$La\",null,{}],[\"$\",\"div\",null,{\"className\":\"wrapper-box\",\"children\":[[\"$\",\"$Lb\",null,{}],[\"$\",\"
