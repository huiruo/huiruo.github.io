cache、\",[\"$\",\"code\",null,{\"children\":\"304\"}],\"、\",[\"$\",\"code\",null,{\"children\":\"200\"}],\"）和 CDN 命中率，并按真实网络条件测试。\"]}],\"\\n\"]}],\"\\n\",[\"$\",\"h2\",null,{\"children\":\"8. 项目面试回答（可直接复述）\"}],\"\\n\",[\"$\",\"blockquote\",null,{\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":[\"我处理静态资源缓存时，先按资源可变性划分：构建产物使用 content hash，因此对 JS、CSS、字体和版本化图片返回 \",[\"$\",\"code\",null,{\"children\":\"Cache-Control: public, max-age=31536000, immutable\"}],\"，用户已有相同文件就不会再发网络请求。HTML 不做永久强缓存，而是设为 \",[\"$\",\"code\",null,{\"children\":\"no-cache\"}],\"，确保每次使用前能快速校验并拿到引用新 chunk 的入口。对于经常更新但响应体较大的公共接口，我让服务端返回 ETag，浏览器过期后携带 \",[\"$\",\"code\",null,{\"children\":\"If-None-Match\"}],\" 校验；未更新则返回 \",[\"$\",\"code\",null,{\"children\":\"304\"}],\"，复用本地响应体。公共内容在 CDN 使用短 \",[\"$\",\"code\",null,{\"children\":\"s-maxage\"}],\" 和可接受的 stale 窗口，登录态、余额、权限等则明确 \",[\"$\",\"code\",null,{\"children\":\"private, no-store\"}],\"，避免跨用户缓存。上线后我通过 Network 的缓存状态、响应体大小、CDN 命中率及 LCP / TTFB 对比验证，同时在发布时保留旧 hash 资源一段时间，防止旧 HTML 与新部署切换期间出现资源 404。\"]}],\"\\n\"]}],\"\\n\",[\"$\",\"h2\",null,{\"children\":\"9. 高频追问速答\"}],\"\\n\",[\"$\",\"h3\",null,{\"children\":\"强缓存和协商缓存谁先？\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"先判断强缓存是否 fresh；命中时不发网络请求。过期或被 \",[\"$\",\"code\",null,{\"children\":\"no-cache\"}],\" 要求验证时，浏览器才携带 \",[\"$\",\"code\",null,{\"children\":\"If-None-Match\"}],\" 或 \",[\"$\",\"code\",null,{\"children\":\"If-Modified-Since\"}],\" 发起协商请求。\"]}],\"\\n\",[\"$\",\"h3\",null,{\"children\":[[\"$\",\"code\",null,{\"children\":\"no-cache\"}],\" 和 \",[\"$\",\"code\",null,{\"children\":\"no-store\"}],\" 区别？\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"code\",null,{\"children\":\"no-cache\"}],\" 可以存，但不能直接复用，必须先重新验证；\",[\"$\",\"code\",null,{\"children\":\"no-store\"}],\" 是不存储。需要始终检查是否有新版本的 HTML 常用前者，敏感且不应在本地 / 中间层留下副本的数据才考虑后者。\"]}],\"\\n\",[\"$\",\"h3\",null,{\"children\":[\"为什么是 \",[\"$\",\"code\",null,{\"children\":\"304\"}],\" 而不是直接读缓存？\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"因为本地副本已过期或策略要求每次验证。\",[\"$\",\"code\",null,{\"children\":\"304\"}],\" 说明网络层已确认资源未变，节省 body，不节省网络往返和校验成本。\"]}],\"\\n\",[\"$\",\"h3\",null,{\"children\":[[\"$\",\"code\",null,{\"children\":\"ETag\"}],\" 和 \",[\"$\",\"code\",null,{\"children\":\"Last-Modified\"}],\" 如何选？\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"优先 \",[\"$\",\"code\",null,{\"children\":\"ETag\"}],\"，它能精确表达版本，不受秒级时间精度限制。静态文件或低频更新资源可同时带 \",[\"$\",\"code\",null,{\"children\":\"Last-Modified\"}],\" 作为兼容兜底；两者都有时客户端以 \",[\"$\",\"code\",null,{\"children\":\"If-None-Match\"}],\" 为主。\"]}],\"\\n\",[\"$\",\"h3\",null,{\"children\":[[\"$\",\"code\",null,{\"children\":\"304\"}],\" 会不会更新缓存时间？\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"会。浏览器会根据 \",[\"$\",\"code\",null,{\"children\":\"304\"}],\" 中允许更新的缓存响应头刷新元数据 / 新鲜度；响应 body 仍沿用本地已有副本。\"]}],\"\\n\",[\"$\",\"h3\",null,{\"children\":[\"有 \",[\"$\",\"code\",null,{\"children\":\"ETag\"}],\" 就一定安全缓存吗？\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"不一定。\",[\"$\",\"code\",null,{\"children\":\"ETag\"}],\" 只解决“内容是否变化”的校验，不处理用户隔离。带 Cookie / Authorization 的响应仍必须正确设置 \",[\"$\",\"code\",null,{\"children\":\"private\"}],\"、\",[\"$\",\"code\",null,{\"children\":\"no-store\"}],\" 或 CDN 缓存键，否则可能泄露数据。\"]}],\"\\n\",[\"$\",\"h2\",null,{\"children\":\"10. 握手与连接：面试速答\"}],\"\\n\",[\"$\",\"h3\",null,{\"children\":\"TCP 为什么要三次握手？\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"客户端先发 \",[\"$\",\"code\",null,{\"children\":\"SYN\"}],\" 申请建立连接，服务端回 \",[\"$\",\"code\",null,{\"children\":\"SYN + ACK\"}],\" 表示自己能接收、也同意建立，客户端再回 \",[\"$\",\"code\",null,{\"children\":\"ACK\"}],\" 确认自己能接收。三次的目标是让双方确认彼此的收发能力，并同步初始序列号；这样服务端不会把网络中延迟到达的旧连接请求误当成有效新连接。\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"建立后 HTTP/1.1 的 keep-alive、HTTP/2 的多路复用都会尽量复用这条连接，避免每个资源都重新握手。连接关闭常说四次挥手：主动方 \",[\"$\",\"code\",null,{\"children\":\"FIN\"}],\"，被动方 \",[\"$\",\"code\",null,{\"children\":\"ACK\"}],\" 后处理剩余数据，再发自己的 \",[\"$\",\"code\",null,{\"children\":\"FIN\"}],\"，最后由主动方 \",[\"$\",\"code\",null,{\"children\":\"ACK\"}],\"；因为 TCP 是全双工，两侧关闭发送方向可以独立发生。\"]}],\"\\n\",[\"$\",\"h3\",null,{\"children\":\"HTTPS 的 TLS 握手做了什么？\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"HTTPS = HTTP + TLS，不是新的 HTTP 方法。TLS 握手主要解决三件事：\",[\"$\",\"strong\",null,{\"children\":\"校验服务端身份、协商密码套件、协商出后续对称加密所用的会话密钥\"}],\"。\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"可以这样回答：\"}],\"\\n\",[\"$\",\"blockquote\",null,{\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":\"浏览器连接 HTTPS 站点时，会先建立 TCP（HTTP/3 除外），再开始 TLS。客户端发送 ClientHello，携带支持的 TLS 版本、密码套件和随机数；服务端选择参数并返回证书。浏览器验证证书链、域名、有效期及信任状态，随后双方基于密钥交换派生共享的对称会话密钥。之后 HTTP 的请求头和请求体才在 TLS 记录层中加密传输。现代 TLS 1.3 将完整握手通常压缩为 1-RTT，恢复会话时可做到 0-RTT；但 0-RTT 存在重放风险，只应承载可安全重放的幂等请求。\"}],\"\\n\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"证书并不是用来加密所有大流量数据的：非对称密码主要用于身份认证和密钥协商，真正传输 HTTP 数据使用性能更好的对称加密。证书校验失败时，不能通过“忽略浏览器警告”来当作正常解决方案。\"}],\"\\n\",[\"$\",\"h3\",null,{\"children\":\"TLS 里有哪些加密方式，各自做什么？\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"| 类别 | 常见算法 / 产物 | TLS 中的职责 | 面试关键点 |\\n| --- | --- | --- | --- |\\n| 对称加密 | AES-GCM、ChaCha20-Poly1305 | 加密后续 HTTP 请求和响应 | 速度快，适合大流量；双方必须持有同一个会话密钥 |\\n| 非对称密码 | RSA、ECDSA、ECDHE | 证书签名校验、身份认证、密钥协商 | 公私钥不相同；现代 TLS 不用 RSA 直接加密会话密钥 |\\n| 哈希 / 消息认证 | SHA-256、HMAC、AEAD 的认证标签 | 完整性校验、防篡改 | 哈希不可逆，不是“加密后可解密”；AEAD 同时保密和认证 |\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"现代 TLS 1.3 的典型组合可以理解为：\",[\"$\",\"strong\",null,{\"children\":\"证书用 RSA 或 ECDSA 签名来证明服务端身份，双方用 ECDHE 协商临时共享秘密，再由它派生 AES-GCM 或 ChaCha20-Poly1305 的对称会话密钥来传输 HTTP 数据。\"}]]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"其中 ECDHE 的 \",[\"$\",\"code\",null,{\"children\":\"E\"}],\" 是 ephemeral（临时）。每次会话使用临时密钥材料，因此即使未来服务器长期私钥泄露，攻击者通常也无法解开以前已录下的会话流量，这叫前向保密（PFS）。TLS 1.3 已移除旧式 RSA 密钥交换及 RC4、3DES、CBC 等不推荐套件；实践中应交给浏览器、CDN 或成熟 TLS 库协商，不要在业务代码里自行实现加密协议。\"]}],\"\\n\",[\"$\",\"h3\",null,{\"children\":\"HTTP/3 还需要 TCP 和 TLS 握手吗？\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"HTTP/3 运行在 QUIC 之上，QUIC 基于 UDP，\",[\"$\",\"strong\",null,{\"children\":\"不建立 TCP 连接\"}],\"；TLS 1.3 被整合进 QUIC 的连接建立过程。它仍需要完成加密与身份校验，但可减少建立连接的往返，并避免 TCP 层单个丢包阻塞同一连接内所有 HTTP/2 stream 的问题。业务优化的原则不变：优先连接复用、减小关键资源、正确缓存，而不是仅靠切换协议版本。\"]}],\"\\n\",[\"$\",\"h2\",null,{\"children\":\"11. CORS 跨域与预检请求\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"同源由\",[\"$\",\"strong\",null,{\"children\":\"协议、域名、端口\"}],\"共同决定；三者任一不同即跨源。浏览器的同源策略会限制脚本读取跨源响应，CORS（Cross-Origin Resource Sharing）是服务端通过响应头明确授权浏览器读取的机制。\"]}],\"\\n\",[\"$\",\"pre\",null,{\"children\":[\"$\",\"code\",null,{\"className\":\"language-http\",\"children\":\"Access-Control-Allow-Origin: https://app.example.com\\nAccess-Control-Allow-Methods: GET, POST, PATCH\\nAccess-Control-Allow-Headers: Content-Type, Authorization\\nAccess-Control-Allow-Credentials: true\\nVary: Origin\\n\"}]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"以下通常会触发浏览器先发 \",[\"$\",\"code\",null,{\"children\":\"OPTIONS\"}],\" 预检：使用 \",[\"$\",\"code\",null,{\"children\":\"PUT\"}],\" / \",[\"$\",\"code\",null,{\"children\":\"PATCH\"}],\" / \",[\"$\",\"code\",null,{\"children\":\"DELETE\"}],\" 等非简单方法；带 \",[\"$\",\"code\",null,{\"children\":\"Authorization\"}],\" 等非简单请求头；或 \",[\"$\",\"code\",null,{\"children\":\"Content-Type: application/json\"}],\"。服务端对预检授权后，浏览器才发送真正业务请求；可以用 \",[\"$\",\"code\",null,{\"children\":\"Access-Control-Max-Age\"}],\" 缓存预检结果，但变更 CORS 策略时要考虑它的生效窗口。\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"面试要讲清三个边界：\"}],\"\\n\",[\"$\",\"ul\",null,{\"children\":[\"\\n\",[\"$\",\"li\",null,{\"children\":[\"CORS 是\",[\"$\",\"strong\",null,{\"children\":\"浏览器读响应的限制\"}],\"。curl、服务端到服务端请求不受它限制，因此不能把 CORS 当作鉴权。\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"带 Cookie 的跨域请求需要客户端显式 \",[\"$\",\"code\",null,{\"children\":\"credentials: 'include'\"}],\"，同时服务端必须返回准确 Origin 和 \",[\"$\",\"code\",null,{\"children\":\"Access-Control-Allow-Credentials: true\"}],\"；此时 \",[\"$\",\"code\",null,{\"children\":\"Access-Control-Allow-Origin\"}],\" \",[\"$\",\"strong\",null,{\"children\":\"不能\"}],\"是 \",[\"$\",\"code\",null,{\"children\":\"*\"}],\"。\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"不要为了“解决跨域”让生产接口无条件允许任意 Origin、任意 Header 和凭证。开发环境代理是同源转发方案，不是生产授权策略。\"}],\"\\n\"]}],\"\\n\",[\"$\",\"h2\",null,{\"children\":\"12. Cookie、Session、Token 与 CSRF / XSS\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"Cookie 是浏览器按域和路径自动附带的状态载体；Session 通常把随机 session id 放入 Cookie，真实登录态存在服务端；JWT / Bearer Token 则是客户端每次通过 \",[\"$\",\"code\",null,{\"children\":\"Authorization: Bearer \u003ctoken\u003e\"}],\" 主动带上凭证。两者都需要过期、刷新、登出和服务端权限校验，选择取决于撤销能力、跨服务验证和业务架构，不能简单认为 JWT 天生更安全。\"]}],\"\\n\",[\"$\",\"pre\",null,{\"children\":[\"$\",\"code\",null,{\"className\":\"language-http\",\"children\":\"Set-Cookie: session=opaque-random-value; Path=/; HttpOnly; Secure; SameSite=Lax\\n\"}]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"| 属性 / 机制 | 解决什么问题 | 注意点 |\\n| --- | --- | --- |\\n| \",[\"$\",\"code\",null,{\"children\":\"HttpOnly\"}],\" | JS 不能直接读取 Cookie，降低 XSS 窃取会话风险 | 不防止 XSS 以当前用户身份发请求 |\\n| \",[\"$\",\"code\",null,{\"children\":\"Secure\"}],\" | Cookie 只走 HTTPS | 本地 HTTP 开发环境需单独配置 |\\n| \",[\"$\",\"code\",null,{\"children\":\"SameSite=Lax\"}],\" | 大多数跨站子请求不自动带 Cookie，降低 CSRF | 顶级 GET 跳转仍可能带 Cookie |\\n| \",[\"$\",\"code\",null,{\"children\":\"SameSite=Strict\"}],\" | 更严格的跨站不带 Cookie | 可能影响第三方跳转后的登录体验 |\\n| \",[\"$\",\"code\",null,{\"children\":\"SameSite=None; Secure\"}],\" | 允许跨站携带 Cookie | 必须 \",[\"$\",\"code\",null,{\"children\":\"Secure\"}],\"，并额外设计 CSRF 防护 |\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"CSRF 的前提是浏览器会自动带 Cookie：攻击网站诱导已登录用户访问或提交目标站请求，服务端若只看 Cookie 就可能误认为是本人操作。防御方式是优先合理设置 \",[\"$\",\"code\",null,{\"children\":\"SameSite\"}],\"，并对敏感写操作校验 CSRF token、\",[\"$\",\"code\",null,{\"children\":\"Origin\"}],\" / \",[\"$\",\"code\",null,{\"children\":\"Referer\"}],\"，要求不可猜测的自定义请求头等。只用 \",[\"$\",\"code\",null,{\"children\":\"POST\"}],\" 不防 CSRF。\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"XSS 是攻击者注入并执行脚本。它可能读取非 HttpOnly 的 token，也能直接调用接口执行操作，所以 Token 放在 localStorage 并不能“天然防 CSRF / 更安全”。根本措施是输出编码、避免危险 HTML 注入、CSP、依赖治理；Cookie 会话再配合 \",[\"$\",\"code\",null,{\"children\":\"HttpOnly\"}],\"、\",[\"$\",\"code\",null,{\"children\":\"Secure\"}],\"、\",[\"$\",\"code\",null,{\"children\":\"SameSite\"}],\" 和 CSRF 校验，是常见的防护组合。\"]}],\"\\n\",[\"$\",\"h2\",null,{\"children\":\"13. 常用安全响应头\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"| 响应头 | 用途 | 示例 / 注意点 |\\n| --- | --- | --- |\\n| \",[\"$\",\"code\",null,{\"children\":\"Strict-Transport-Security\"}],\" | 强制浏览器后续仅通过 HTTPS 访问 | \",[\"$\",\"code\",null,{\"children\":\"max-age=31536000; includeSubDomains\"}],\"；确认所有子域都支持 HTTPS 后再加子域与 preload |\\n| \",[\"$\",\"code\",null,{\"children\":\"Content-Security-Policy\"}],\" | 限制脚本、样式、图片、frame 等加载来源，降低 XSS 影响 | 优先 nonce / hash，避免长期使用 \",[\"$\",\"code\",null,{\"children\":\"unsafe-inline\"}],\" |\\n| \",[\"$\",\"code\",null,{\"children\":\"X-Content-Type-Options\"}],\" | 阻止 MIME sniffing | \",[\"$\",\"code\",null,{\"children\":\"nosniff\"}],\" |\\n| \",[\"$\",\"code\",null,{\"children\":\"frame-ancestors\"}],\"（CSP） | 控制谁能嵌入页面，防点击劫持 | 用它替代 / 补充旧的 \",[\"$\",\"code\",null,{\"children\":\"X-Frame-Options\"}],\" |\\n| \",[\"$\",\"code\",null,{\"children\":\"Referrer-Policy\"}],\" | 控制跳转时 Referer 泄露范围 | 常用 \",[\"$\",\"code\",null,{\"children\":\"strict-origin-when-cross-origin\"}],\" |\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"安全头只能缩小攻击面，不能替代服务端鉴权、参数校验、输出编码和 HTTPS。CSP 上线前可先使用 \",[\"$\",\"code\",null,{\"children\":\"Content-Security-Policy-Report-Only\"}],\" 收集违规报告，再逐步收紧，避免直接发布导致第三方 SDK 或内联脚本白屏。\"]}],\"\\n\",[\"$\",\"h2\",null,{\"children\":\"14. 上传、下载与断点续传\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"浏览器普通文件上传通常使用 \",[\"$\",\"code\",null,{\"children\":\"multipart/form-data\"}],\"，文件大时需要限制类型、大小、数量和超时时间；服务端应根据文件内容 / 魔数校验，生成自己的存储名，不信任客户端文件名和 \",[\"$\",\"code\",null,{\"children\":\"Content-Type\"}],\"，并把上传权限、病毒扫描和对象存储访问控制纳入流程。\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"下载可使用：\"}],\"\\n\",[\"$\",\"pre\",null,{\"children\":[\"$\",\"code\",null,{\"className\":\"language-http\",\"children\":\"Content-Type: application/pdf\\nContent-Disposition: attachment; filename=\\\"report.pdf\\\"\\n\"}]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"code\",null,{\"children\":\"Content-Disposition: attachment\"}],\" 提示下载，\",[\"$\",\"code\",null,{\"children\":\"inline\"}],\" 则允许浏览器按能力预览。视频播放和大文件断点续传依赖 Range 请求：浏览器请求 \",[\"$\",\"code\",null,{\"children\":\"Range: bytes=1000-\"}],\"，服务端响应 \",[\"$\",\"code\",null,{\"children\":\"206 Partial Content\"}],\"、\",[\"$\",\"code\",null,{\"children\":\"Content-Range\"}],\" 和 \",[\"$\",\"code\",null,{\"children\":\"Accept-Ranges: bytes\"}],\"。服务端不支持范围请求时通常回完整 \",[\"$\",\"code\",null,{\"children\":\"200\"}],\"；只有确认资源可随机读取、分片合并校验和鉴权都正确时，才在业务层实现分片上传。\"]}],\"\\n\",[\"$\",\"h2\",null,{\"children\":\"15. 代理、CDN 与真实客户端 IP\"}],\"\\n\",[\"$\",\"ul\",null,{\"children\":[\"\\n\",[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"正向代理\"}],\"代表客户端访问外部网络，常用于企业网络、调试或访问控制；目标服务看到的是代理。\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"反向代理\"}],\"部署在服务端前面，对外代表源站，负责 TLS 终止、负载均衡、静态文件、限流和路由；Nginx、网关与 CDN 都可承担这个角色。\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"CDN\"}],\" 在边缘节点缓存可共享资源，命中时不回源；未命中或过期时按策略回源。它应与前面的 \",[\"$\",\"code\",null,{\"children\":\"Cache-Control\"}],\"、缓存键和失效策略一起设计。\"]}],\"\\n\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"经过反向代理后，应用看到的连接来源往往是代理 IP，因此代理会传递 \",[\"$\",\"code\",null,{\"children\":\"X-Forwarded-For\"}],\"、\",[\"$\",\"code\",null,{\"children\":\"X-Forwarded-Proto\"}],\" 或标准 \",[\"$\",\"code\",null,{\"children\":\"Forwarded\"}],\"。应用只能信任\",[\"$\",\"strong\",null,{\"children\":\"由自家可信代理覆盖或追加\"}],\"的这些头；如果直接信任公网客户端自带的 \",[\"$\",\"code\",null,{\"children\":\"X-Forwarded-For\"}],\"，攻击者可伪造 IP 绕过基于 IP 的限流、风控或审计。\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"面试可补一句：缓存穿透是反复请求不存在的 key，应用可对空结果短暂缓存、做参数校验或使用布隆过滤器；缓存击穿是热点 key 失效时并发回源，可用互斥更新、逻辑过期或提前刷新；缓存雪崩是大量 key 同时过期，可通过 TTL 加随机抖动、分批预热和降级处理。它们主要是服务端缓存问题，但 CDN / HTTP 缓存策略设计会直接影响回源压力。\"}],\"\\n\",[\"$\",\"h2\",null,{\"children\":\"16. HTTP 流式传输、SSE 与 AI 输出\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"HTTP 流式传输指服务端\",[\"$\",\"strong\",null,{\"children\":\"不必等完整响应生成完\"}],\"，而是先发响应头，再持续写出一段段 body；浏览器收到首段即可开始消费和渲染。它适合 AI token 输出、日志、进度、长任务结果和 SSR 流式页面，核心收益是降低“首字节 / 首段可见”的等待时间，而不是让总计算时间凭空变短。\"]}],\"\\n\",[\"$\",\"h3\",null,{\"children\":\"HTTP/1.1、HTTP/2 与 HTTP/3 的传输形式\"}],\"\\n\",[\"$\",\"ul\",null,{\"children\":[\"\\n\",[\"$\",\"li\",null,{\"children\":[\"HTTP/1.1 若响应长度未知，常使用 \",[\"$\",\"code\",null,{\"children\":\"Transfer-Encoding: chunked\"}],\"：每个分块前带十六进制长度，长度为 \",[\"$\",\"code\",null,{\"children\":\"0\"}],\" 表示结束；此时不能再同时发送 \",[\"$\",\"code\",null,{\"children\":\"Content-Length\"}],\"。\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"HTTP/2 / HTTP/3 以各自协议的 DATA frame 承载 body，天然知道流结束，\",[\"$\",\"strong\",null,{\"children\":[\"不使用 HTTP/1.1 的 \",[\"$\",\"code\",null,{\"children\":\"chunked\"}],\" 格式\"]}],\"。应用层“边生成边写”的概念仍相同。\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"流式响应通常不宜被共享缓存；对动态个人结果可用 \",[\"$\",\"code\",null,{\"children\":\"Cache-Control: no-store\"}],\"。若压缩、CDN 或反向代理缓冲完整响应后才下发，用户依旧看不到流式效果。\"]}],\"\\n\"]}],\"\\n\",[\"$\",\"h3\",null,{\"children\":\"浏览器如何读取普通流式 HTTP 响应\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"服务端可以返回 NDJSON（每行一条 JSON），前端通过 \",[\"$\",\"code\",null,{\"children\":\"fetch\"}],\" 的 \",[\"$\",\"code\",null,{\"children\":\"ReadableStream\"}],\" 逐块解码。网络 chunk 不保证刚好等于一条业务消息，因此必须自己缓冲并按协议边界切分：\"]}],\"\\n\",[\"$\",\"pre\",null,{\"children\":[\"$\",\"code\",null,{\"className\":\"language-ts\",\"children\":\"const response = await fetch('/api/generate', { method: 'POST' });\\nif (!response.ok || !response.body) throw new Error('stream unavailable');\\n\\nconst reader = response.body.pipeThrough(new TextDecoderStream()).getReader();\\nlet pending = '';\\n\\nwhile (true) {\\n  const { value, done } = await reader.read();\\n  if (done) break;\\n  pending += value;\\n  const lines = pending.split('\\\\n');\\n  pending = lines.pop() ?? '';\\n  for (const line of lines) {\\n    if (line) renderChunk(JSON.parse(line));\\n  }\\n}\\n\"}]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"取消时可使用 \",[\"$\",\"code\",null,{\"children\":\"AbortController\"}],\"；服务端也应监听连接断开，停止模型生成或长任务，避免用户离开页面后继续消耗资源。前端更新 UI 时可按 token / 时间片批量更新，避免每个很小分片都触发一次昂贵渲染。\"]}],\"\\n\",[\"$\",\"h3\",null,{\"children\":\"SSE 和 WebSocket 怎么选？\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"SSE（Server-Sent Events）是建立在 HTTP 上的\",[\"$\",\"strong\",null,{\"children\":\"服务端单向推送\"}],\"协议，响应类型为 \",[\"$\",\"code\",null,{\"children\":\"text/event-stream\"}],\"，每条事件通常以 \",[\"$\",\"code\",null,{\"children\":\"data:\"}],\" 开头、空行结束。浏览器原生 \",[\"$\",\"code\",null,{\"children\":\"EventSource\"}],\" 自动重连，适合通知、行情、进度和 token 推送；标准 \",[\"$\",\"code\",null,{\"children\":\"EventSource\"}],\" 只发 GET，且不能方便地自定义 \",[\"$\",\"code\",null,{\"children\":\"Authorization\"}],\" 请求头，认证方案需谨慎设计。\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"WebSocket 是升级后的全双工长连接，适合聊天室、协作编辑、双向实时游戏指令等客户端也要高频发送消息的场景。若只是一次请求对应一段连续结果（例如 AI 问答），普通 \",[\"$\",\"code\",null,{\"children\":\"fetch\"}],\" 流式响应通常更简单，也更容易复用既有 HTTP 鉴权、网关和可观测性。\"]}],\"\\n\",[\"$\",\"h3\",null,{\"children\":\"流式输出没有生效，怎么排查？\"}],\"\\n\",[\"$\",\"ol\",null,{\"children\":[\"\\n\",[\"$\",\"li\",null,{\"children\":\"浏览器 Network 看响应是否持续增长、首段是否早到；不要只看服务端日志“已经 write”。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"检查应用是否真的 \",[\"$\",\"code\",null,{\"children\":\"flush\"}],\" / 持续写入，以及是否错误设置了完整 \",[\"$\",\"code\",null,{\"children\":\"Content-Length\"}],\"。\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"检查 Nginx / CDN / 网关缓冲；例如 Nginx 可为该流式 location 关闭 \",[\"$\",\"code\",null,{\"children\":\"proxy_buffering\"}],\"，但应只对需要的接口开启，并评估连接占用和超时。\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"避免把完整结果先聚合在 BFF 或 Server Component 再转发；每一跳都要支持边读边写。\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"为心跳、超时、错误事件、断线取消和重连设计协议，且不要把流式接口放进会破坏分段的响应缓存。\"}],\"\\n\"]}],\"\\n\",[\"$\",\"h3\",null,{\"children\":\"面试可直接回答\"}],\"\\n\",[\"$\",\"blockquote\",null,{\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":[\"AI 输出这类场景我会使用 HTTP 流式响应：服务端生成一部分就写一
